name: SADEE X DIMA - Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract the ZIP automatically
      - name: Extract SADEE X DIMA Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SADEE-X-DIMA-GitHub-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo "Upload the ZIP to the repository root."
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          find extracted -maxdepth 3 -type f | head -100

      # 4. Find the actual Gradle project
      - name: Locate Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -name "settings.gradle.kts" -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at:"
          echo "$PROJECT_DIR"

      # 5. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Build Optimizer
      - name: Build Optimizer APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :optimizer:assembleDebug --stacktrace

      # 7. Build Admin
      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :admin:assembleDebug --stacktrace

      # 8. Upload Optimizer APK
      - name: Upload Optimizer APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Optimizer
          path: ${{ env.PROJECT_DIR }}/optimizer/build/outputs/apk/debug/optimizer-debug.apk

      # 9. Upload Admin APK
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Admin
          path: ${{ env.PROJECT_DIR }}/admin/build/outputs/apk/debug/admin-debug.apk
