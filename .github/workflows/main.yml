name: SADEE X DIMA - Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout repository
      # --------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Java 17
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------
      # 3. Find ZIP file
      # --------------------------------
      - name: Find Project ZIP
        shell: bash
        run: |

          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "*.zip" -o -name "*SADEE*X*DIMA*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------
      # 4. Extract ZIP automatically
      # --------------------------------
      - name: Extract Project ZIP
        shell: bash
        run: |

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort


      # --------------------------------
      # 5. Find Android project
      # --------------------------------
      - name: Locate Android Project
        shell: bash
        run: |

          SETTINGS_FILE=$(find extracted -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------
      # 6. Show project structure
      # --------------------------------
      - name: Show Project Structure
        shell: bash
        run: |

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort


      # --------------------------------
      # 7. Fix Java/Kotlin compatibility
      # --------------------------------
      - name: Fix Gradle Java 17 Settings
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path

          root = Path("${{ env.PROJECT_DIR }}")

          files = [
              root / "optimizer" / "build.gradle.kts",
              root / "admin" / "build.gradle.kts"
          ]

          for file in files:

              if not file.exists():
                  print("Missing:", file)
                  continue

              text = file.read_text()

              additions = """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

              if "jvmTarget = \"17\"" not in text:
                  text += additions

              file.write_text(text)

              print("Patched:", file)

          PY


      # --------------------------------
      # 8. FIX ADMIN MAIN ACTIVITY
      # --------------------------------
      - name: Fix Admin MainActivity
        shell: bash
        run: |

          mkdir -p \
          "$PROJECT_DIR/admin/src/main/java/com/sadeedima/admin"

          cat > \
          "$PROJECT_DIR/admin/src/main/java/com/sadeedima/admin/MainActivity.kt" \
          <<'KOTLIN'

          package com.sadeedima.admin

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var historyBox: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  buildUi()
              }

              private fun buildUi() {

                  val root = LinearLayout(this)

                  root.orientation = LinearLayout.VERTICAL

                  root.setPadding(
                      24,
                      28,
                      24,
                      24
                  )

                  root.setBackgroundColor(
                      Color.rgb(7, 7, 10)
                  )


                  val scroll = ScrollView(this)

                  scroll.addView(root)


                  root.addView(
                      makeText(
                          "SADEE X DIMA",
                          30f,
                          Color.WHITE
                      )
                  )


                  root.addView(
                      makeText(
                          "ADMIN PANEL",
                          18f,
                          Color.rgb(255, 40, 40)
                      )
                  )


                  root.addView(
                      makeText(
                          "License Key Generator",
                          16f,
                          Color.LTGRAY
                      )
                  )


                  val durations = listOf(
                      Pair("1 DAY", 1),
                      Pair("3 DAYS", 3),
                      Pair("5 DAYS", 5),
                      Pair("7 DAYS", 7),
                      Pair("14 DAYS", 14),
                      Pair("30 DAYS", 30),
                      Pair("LIFETIME", null)
                  )


                  for (item in durations) {

                      val label = item.first
                      val days = item.second

                      root.addView(
                          makeButton(
                              "GENERATE $label"
                          ) {

                              val key =
                                  KeyGenerator.generate(
                                      this,
                                      days
                                  )

                              showGeneratedKey(
                                  key,
                                  label
                              )

                              refreshHistory()
                          }
                      )
                  }


                  val historyTitle =
                      makeText(
                          "KEY HISTORY",
                          19f,
                          Color.WHITE
                      )

                  historyTitle.setPadding(
                      0,
                      28,
                      0,
                      12
                  )

                  root.addView(historyTitle)


                  historyBox =
                      LinearLayout(this)

                  historyBox.orientation =
                      LinearLayout.VERTICAL

                  root.addView(historyBox)


                  refreshHistory()


                  setContentView(scroll)
              }


              private fun showGeneratedKey(
                  key: String,
                  plan: String
              ) {

                  val input =
                      EditText(this)

                  input.setText(key)

                  input.setTextIsSelectable(true)

                  input.setSingleLine(true)


                  AlertDialog.Builder(this)

                      .setTitle(
                          "$plan KEY GENERATED"
                      )

                      .setMessage(
                          "Copy this key into the Optimizer app."
                      )

                      .setView(input)

                      .setPositiveButton(
                          "COPY"
                      ) { _, _ ->

                          val clipboard =
                              getSystemService(
                                  CLIPBOARD_SERVICE
                              ) as ClipboardManager


                          clipboard.setPrimaryClip(
                              ClipData.newPlainText(
                                  "SADEE X DIMA KEY",
                                  key
                              )
                          )


                          Toast.makeText(
                              this,
                              "Key copied",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      .setNegativeButton(
                          "CLOSE",
                          null
                      )

                      .show()
              }


              private fun refreshHistory() {

                  if (!::historyBox.isInitialized) {
                      return
                  }


                  historyBox.removeAllViews()


                  val history =
                      KeyGenerator.history(this)


                  for (line in history) {

                      val parts =
                          line.split("|")


                      val key =
                          parts.getOrNull(0)
                              ?: continue


                      val plan =
                          parts.getOrNull(1)
                              ?: "UNKNOWN"


                      val expiry =
                          parts.getOrNull(2)
                              ?.toLongOrNull()
                              ?: 0L


                      val expiryText: String


                      if (expiry == 0L) {

                          expiryText =
                              "No expiry"

                      } else {

                          expiryText =
                              SimpleDateFormat(
                                  "yyyy-MM-dd HH:mm",
                                  Locale.US
                              ).format(
                                  Date(expiry)
                              )
                      }


                      val itemText =
                          "$key\nPlan: $plan\nExpiry: $expiryText"


                      val itemView =
                          makeText(
                              itemText,
                              14f,
                              Color.WHITE
                          )


                      itemView.setPadding(
                          16,
                          16,
                          16,
                          16
                      )


                      itemView.setBackgroundColor(
                          Color.rgb(
                              25,
                              25,
                              30
                          )
                      )


                      val params =
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )


                      params.setMargins(
                          0,
                          0,
                          0,
                          10
                      )


                      itemView.layoutParams =
                          params


                      historyBox.addView(
                          itemView
                      )
                  }
              }


              private fun makeText(
                  value: String,
                  size: Float,
                  color: Int
              ): TextView {

                  val view =
                      TextView(this)

                  view.text = value

                  view.textSize = size

                  view.setTextColor(color)

                  return view
              }


              private fun makeButton(
                  value: String,
                  action: () -> Unit
              ): Button {

                  val button =
                      Button(this)

                  button.text = value

                  button.textSize = 14f

                  button.setTextColor(
                      Color.WHITE
                  )

                  button.setBackgroundColor(
                      Color.rgb(
                          45,
                          20,
                          20
                      )
                  )


                  button.setOnClickListener {
                      action()
                  }


                  val params =
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          58
                      )


                  params.setMargins(
                      0,
                      10,
                      0,
                      0
                  )


                  button.layoutParams =
                      params


                  return button
              }
          }

          KOTLIN

          echo "Admin MainActivity.kt replaced successfully."


      # --------------------------------
      # 9. Install Gradle 8.9
      # --------------------------------
      - name: Install Gradle 8.9
        shell: bash
        run: |

          wget -q \
          https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # --------------------------------
      # 10. Build Optimizer APK
      # --------------------------------
      - name: Build Optimizer APK
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          gradle \
            :optimizer:assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------
      # 11. Build Admin APK
      # --------------------------------
      - name: Build Admin APK
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          gradle \
            :admin:assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------
      # 12. Find APK files
      # --------------------------------
      - name: Find APKs
        shell: bash
        run: |

          echo "APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------
      # 13. Upload Optimizer APK
      # --------------------------------
      - name: Upload Optimizer APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Optimizer
          path: |
            ${{ env.PROJECT_DIR }}/optimizer/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # --------------------------------
      # 14. Upload Admin APK
      # --------------------------------
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Admin-Panel
          path: |
            ${{ env.PROJECT_DIR }}/admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
