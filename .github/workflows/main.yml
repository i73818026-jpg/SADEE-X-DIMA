name: SADEE X DIMA - Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="SADEE-X-DIMA-GitHub-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -name "settings.gradle.kts" -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # FIX: Java 8 vs Kotlin 17
      - name: Fix JVM Target Compatibility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path("${{ env.PROJECT_DIR }}")

          for module in ["optimizer", "admin"]:
              file = project / module / "build.gradle.kts"

              if not file.exists():
                  print(f"Skipping missing file: {file}")
                  continue

              text = file.read_text()

              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
                  marker = "    buildFeatures { buildConfig = true }"

                  fix = '''    buildFeatures { buildConfig = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''

                  if marker in text:
                      text = text.replace(marker, fix, 1)
                  else:
                      text += '''

              android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
              '''

                  file.write_text(text)

              print(f"Fixed JVM target: {file}")
          PY

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle projects

      - name: Build Optimizer APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :optimizer:assembleDebug --stacktrace

      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :admin:assembleDebug --stacktrace

      - name: Upload Optimizer APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Optimizer
          path: ${{ env.PROJECT_DIR }}/optimizer/build/outputs/apk/debug/optimizer-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Admin
          path: ${{ env.PROJECT_DIR }}/admin/build/outputs/apk/debug/admin-debug.apk
